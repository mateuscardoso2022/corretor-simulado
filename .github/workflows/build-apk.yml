name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential libltdl-dev

      - name: Instalar Buildozer
        run: pip install --upgrade buildozer cython virtualenv

      - name: Compilar APK
        run: |
          for i in 1 2 3 4 5; do
            yes | buildozer -v android debug && break
            echo "Tentativa $i falhou (provavelmente erro 502 temporário). Tentando de novo em 30s..."
            sleep 30
          done

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: corretor-simulado-apk
          path: bin/*.apk
